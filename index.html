<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riyadh Property Explorer</title>
    
    <!-- مكتبة Leaflet للتنسيق -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- مكتبة FontAwesome والأيقونات -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    
    <!-- ملف التنسيق الخاص بالمشروع -->
    <link rel="stylesheet" href="style.css" type="text/css" />

    <!-- إخبار المتصفح بكيفية الوصول لمكتبة proj4 كموديول -->
    <script type="importmap">
      {
        "imports": {
          "proj4": "https://esm.sh/proj4@2.15.0"
        }
      }
    </script>
  </head>

  <body>
    <!-- 1. الشريط العلوي (Header) -->
    <header class="app-header">
      <div class="logo-area">
        <i class="fas fa-layer-group geo-icon"></i>
        <h1>Riyadh Property Explorer</h1>
      </div>
      <!-- تحديث شارة الأسبوع إلى الأسبوع 5 -->
      <div class="badge">المرحلة 1: الاسبوع 5</div>
    </header>

    <!-- الحاوية الرئيسية -->
    <div class="app-container">
      <!-- 2. القائمة الجانبية (Aside) -->
      <aside class="sidebar">
        <h2>لوحة التحكم والميزات</h2>

        <!-- ميزة محول الإحداثيات -->
        <section class="feature-card" id="coordinate-converter">
          <div class="converter-panel">
            <h3>Coordinate Converter .2</h3>
            <div class="input-group">
              <label for="latInput">خط العرض (Latitude):</label>
              <input type="number" id="latInput" value="24.8211" step="0.0001" placeholder="24.8211">
            </div>
            <div class="input-group">
              <label for="lngInput">خط الطول (Longitude):</label>
              <input type="number" id="lngInput" value="46.6343" step="0.0001" placeholder="46.6343">
            </div>
            <button id="convertBtn">تحويل وانتقال</button>
            <div id="resultBox" class="result-box" style="display: none;">
              <p id="resultText">النظام: --</p>
            </div>
          </div>
        </section>

        <!-- ميزة إدارة الطبقات المكانية (Layer Manager) -->
        <section class="feature-card" id="layer-manager-card">
          <h3>Layer Manager (In Progress 🔄)</h3>
          <div id="layers-list"></div>
          
          <!-- <div class="layer-toggles">
            <label class="toggle-item">
              <input type="checkbox" id="chk-properties" checked />
              <span>عقارات الرياض</span>
            </label>
            <label class="toggle-item">
              <input type="checkbox" id="chk-stations" checked />
              <span>محطات المسح الجيوديسي</span>
            </label>
          </div> -->
        </section>

        <!-- مكون بطاقة المحطة المساحية (Survey Station Card) -->
        <section class="feature-card" id="survey-station-container">
          <h3>تفاصيل المحطة المساحية</h3>
          <div id="survey-station-content"> 
            <!-- سيتم حقنه ديناميكياً بواسطة SurveyStationCardComponent -->
          </div>
        </section>

        <!-- الميزة القادمة -->
        <section class="feature-card" id="spatial-search">
          <h3>4. Spatial Search</h3>
          <p>بحث + فلاتر وتصفية الـ UI (Upcoming ⏳)</p>
        </section>
      </aside>

      <!-- 3. المساحة الرئيسية (Main) -->
      <main class="map-area">

        <!-- مكان ظهور خريطة Leaflet -->
        <div id="map"></div>
        
        <!-- واجهة حاسبة مساحات الأراضي -->
        <div id="calculator-container" class="calculator-card">
          <h3>حاسبة مساحات الأراضي في الرياض</h3>

          <label for="land-length">الطول (بالمتر):</label>
          <input type="number" id="land-length" placeholder="مثال: 30">

          <label for="land-width">العرض (بالمتر):</label>
          <input type="number" id="land-width" placeholder="مثال: 20">

          <button id="btn-calculate">احسب المساحة</button>

          <div id="calculation-result" class="calc-result-default">
            المساحة الإجمالية: -- م²
          </div>
        </div>
      </main>
    </div>

    <!-- 1. استدعاء مكتبة Leaflet الأساسية لتوفير الـ L Global Object -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 2. استدعاء الموديول البرمجي الرئيسي الخاص بك -->
    <script type="module" src="./app.js"></script>

  </body>
</html>
