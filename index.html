<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riyadh Property Explorer</title>

    <!-- 1. يجب أن يكون الـ importmap هو أول سكربت في الـ head -->
    <script type="importmap">
    {
      "imports": {
        "leaflet": "https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.esm.js",
        "proj4": "https://esm.sh/proj4@2.15.0"
      }
    }
    </script>
    
    <!-- 2. تنسيقات Leaflet و FontAwesome -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="shortcut icon" href="#">

    <!-- 3. ملفات CSS الخاصة بالمشروع -->
    <link rel="stylesheet" href="./src/assets/styles/layout.css">
    <link rel="stylesheet" href="./src/assets/styles/feedback.css" />
    <link rel="stylesheet" href="style.css" type="text/css" />

    

  </head>
  <body>
    <!-- 1. الشريط العلوي (Header) -->
    <header class="app-header">
      <div class="logo-area">
        <i class="fas fa-layer-group geo-icon"></i>
        <h1>Riyadh Property Explorer</h1>
      </div>
    </header> 

    <!-- الحاوية الرئيسية -->
    <div class="app-container">
      <!-- 2. القائمة الجانبية (Aside) -->
      <aside class="sidebar">
        <h2>لوحة التحكم والميزات</h2>

        <!-- ميزة محول الإحداثيات -->
        <section class="feature-card" id="coordinate-converter">
          <div id="converter-widget">
            <!-- سيتم حشوه ديناميكياً عبر converterUI.render() -->
          </div>
        </section>

        <!-- ميزة إدارة الطبقات المكانية (Layer Manager) -->
        <section class="feature-card box-shadow" id="layer-manager-card">
          <h3>Layer Manager</h3>
          <div id="layers-list"></div>

          <div class="layer-control-item">
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
              <input type="checkbox" id="chk-properties" checked />
              <span>عقارات الرياض</span>
            </label>
          </div>

          <!-- خيار محطات المسح -->
          <div class="layer-control-item">
            <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
              <input type="checkbox" id="chk-survey-stations" />
              <span>محطات المسح الجغرافي</span>
            </label>
          </div>

          <!-- حاوية عرض كروت المحطات الجانبية (تم فك التعليق عنها) -->
          <div id="survey-station-container" class="survey-stations-list">
            <!-- سيتم توليد الكروت هنا ديناميكياً بواسطة JavaScript -->
          </div>
        </section>

        <section class="feature-card" id="spatial-search">
          <h3>Spatial Search</h3>
          <div id="spatial-search-container" class="sidebar-section">
            <div id="search-panel">
              <input type="text" id="txt-search-query" placeholder="ابحث باسم الحي..." />
              <select id="sel-property-type">
                <option value="ALL">جميع الأنواع</option>
              </select>

              <button id="btn-reset-search" type="button" class="btn-secondary" style="margin-top: 10px; width: 100%;">
                🔄 إعادة ضبط البحث
              </button>
              
              <div id="search-summary-container"></div>

              <div id="no-results-msg" style="display: none; color: #ef4444; padding: 10px;">
                عذراً، لم يتم العثور على نتائج تطابق معايير البحث.
              </div>
            </div>
          </div>
        </section>
      </aside>

      <!-- 3. المساحة الرئيسية (Main) -->
      <main class="map-area">

        <!-- مكان ظهور خريطة Leaflet -->
        <div id="map"></div>
        
        <!-- واجهة حاسبة مساحات الأراضي -->
        <div id="land-calculator-widget" class="feature-card">
          <h3>حاسبة مساحات الأراضي في الرياض</h3>

          <label for="land-length">الطول (بالمتر):</label>
          <input type="number" id="land-length" placeholder="مثال: 30">

          <label for="land-width">العرض (بالمتر):</label>
          <input type="number" id="land-width" placeholder="مثال: 20">

          <button id="btn-calculate">احسب المساحة</button>

          <div id="calculation-result" class="calc-result-default">
            المساحة الإجمالية: -- م²
          </div>
        </div>
      </main>
    </div>

    <!-- 1. استدعاء مكتبة Leaflet الأساسية لتوفير الـ L Global Object -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- 2. استدعاء الموديول البرمجي الرئيسي الخاص بك -->
    <script type="module" src="./app.js"></script>

  </body>
</html>
