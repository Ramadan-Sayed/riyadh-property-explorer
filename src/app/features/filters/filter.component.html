<div class="filter-component-panel">
  <div class="filter-group">
    <label for="txt-search">البحث (الرمز أو الحي):</label>
    <input type="text" id="txt-search" placeholder="مثال: MALQA-001 أو الملقا" />
  </div>

  <div class="filter-group">
    <label for="sel-district">الحي:</label>
    <select id="sel-district">
      <option value="">جميع الأحياء (All Districts)</option>
    </select>
  </div>

  <div class="filter-group">
    <label for="sel-type">نوع العقار:</label>
    <select id="sel-type">
      <option value="">جميع الأنواع (All Types)</option>
    </select>
  </div>

  <button id="btn-clear-filters" type="button" class="btn-clear">
    🔄 مسح الفلاتر (Reset)
  </button>
</div>
